name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/injust/mossy-meals

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/dev-stack
        with:
          save-cache: 'true'

      - run: make ci-build

      - run: make ci-bundle

      - uses: actions/upload-artifact@v7
        with:
          name: ci-build
          path: ci-build.tgz
          retention-days: 1
          compression-level: 0

      - if: always()
        run: docker compose down --volumes

  checks:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/dev-stack

      - uses: actions/download-artifact@v4
        with:
          name: ci-build

      - run: make ci-unbundle ci-warmup

      - run: make -j4 --output-sync=target ci-checks

      - if: always()
        run: docker compose down --volumes

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        part:
          - { name: shard-1, args: --shard=1/2 }
          - { name: shard-2, args: --shard=2/2 }
    name: e2e (${{ matrix.part.name }})
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/dev-stack

      - uses: actions/download-artifact@v4
        with:
          name: ci-build

      - run: make ci-unbundle

      - run: make ci-e2e PLAYWRIGHT_ARGS="${{ matrix.part.args }}"

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.part.name }}
          path: e2e/playwright-report
          if-no-files-found: ignore

      - if: always()
        run: docker compose --profile e2e down --volumes

  publish:
    needs: [checks, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - id: tag
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: |
            type=gha,scope=prod
            type=gha,scope=dev
          cache-to: type=gha,scope=prod,mode=max
