services:
  app:
    image: ${IMAGE:-docker.io/injust/muhmeal}:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@database:5432/${POSTGRES_DB:-app}?serverVersion=18&charset=utf8
      SYMFONY_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
      SYMFONY_TRUSTED_HEADERS: x-forwarded-for,x-forwarded-host,x-forwarded-proto,x-forwarded-port
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:80"
    volumes:
      - app_share:/app/var/share

  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - database_data:/var/lib/postgresql:rw

volumes:
  database_data:
  app_share:
