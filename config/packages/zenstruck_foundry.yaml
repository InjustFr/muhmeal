when@dev: &dev
    # See full configuration: https://symfony.com/bundles/ZenstruckFoundryBundle/current/index.html#full-default-bundle-configuration
    zenstruck_foundry:
        persistence:
            # Flush only once per call of `PersistentObjectFactory::create()`
            flush_once: true

    # Mock data for local testing lives outside src/ (it is not part of the onion layers).
    services:
        App\Fixtures\:
            resource: '%kernel.project_dir%/fixtures/'
            autowire: true
            autoconfigure: true

when@test: *dev
